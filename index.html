@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.07)}}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(70,20,0,.12),transparent 35%,rgba(70,15,0,.22));pointer-events:none}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.topline{opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 1.2s;position:absolute;top:43%;left:0;width:100%;overflow:hidden;white-space:nowrap;text-align:center;z-index:3}
.topline span{display:inline-block;padding-left:100%;font:bold clamp(32px,6vw,72px) Georgia,serif;color:#fff4b5;text-shadow:0 0 10px #ff6a00,0 0 28px #ffb000,0 3px 4px #7d2600;animation:slide 15s linear infinite}
@keyframes slide{to{transform:translateX(-100%)}}
.greeting{opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 1.2s;position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(94%,900px);text-align:center;padding:18px 22px;border:1px solid rgba(255,232,150,.8);border-radius:22px;background:rgba(112,35,0,.48);box-shadow:0 0 30px rgba(255,145,0,.55);backdrop-filter:blur(4px)}
.greeting h2{font-size:clamp(24px,4vw,42px);color:#fff1a8;text-shadow:0 0 15px #ff7a00;animation:pulse 2s ease-in-out infinite alternate}
.greeting p{font:clamp(15px,2.1vw,23px)/1.5 Arial,sans-serif;margin-top:8px;color:#fff}
.greeting .signature{margin-top:14px;color:#ffe19a;font:italic clamp(16px,2vw,21px) Georgia,serif;text-shadow:0 0 12px #ff8a00}
@keyframes pulse{to{text-shadow:0 0 28px #ff5c00,0 0 45px #ffbd00}}
body.show-wishes .topline,body.show-wishes .greeting{opacity:1;visibility:visible}
button{position:fixed;bottom:22px;right:22px;z-index:5;padding:12px 20px;border:1px solid #fff0a0;border-radius:30px;background:linear-gradient(135deg,#e65b00,#ffbf19);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 0 18px #ff9d00}
button:hover{filter:brightness(1.12)}
@media(max-width:600px){.scene{background-position:center center;background-size:contain}.topline{top:40%}.greeting{bottom:12%;padding:14px 12px}button{right:50%;transform:translateX(50%);bottom:13%;width:78%;min-height:48px;white-space:nowrap;background:rgba(130,20,25,.10);border:0;color:transparent;box-shadow:none;text-shadow:none;font-size:1px}}
</style>
</head>
<body>
<div class="scene"></div><div class="shade"></div>
<canvas id="fireworks"></canvas>
<div class="topline"><span>✨ HAPPY DIWALI ✨</span></div>
<section class="greeting">
  <h2>🪔 शुभ दीपावली 🪔</h2>
  <p>May this Diwali bring endless happiness, new beginnings, and countless moments of togetherness to our family.</p>
  <p><strong>Happy Diwali to you and your family! 🙏</strong></p>
  <p class="signature"><strong>Aman Sharma</strong></p>
</section>
<button id="wishButton" onclick="showWishes()">🪔 Click for Diwali Wishes</button>
<script>
const canvas=document.getElementById('fireworks'),ctx=canvas.getContext('2d');
let rockets=[],sparks=[];
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
const colors=['#fff2a6','#ffcc00','#ff6b00','#ff3d81','#fff','#ff9f1c'];
function launch(x=Math.random()*innerWidth){rockets.push({x,y:innerHeight+5,target:innerHeight*(.15+Math.random()*.42),speed:6+Math.random()*3,color:colors[Math.floor(Math.random()*colors.length)]})}
function burst(x,y,color){for(let i=0;i<85;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*5;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:1+Math.random()*2})}}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);
 rockets=rockets.filter(r=>{r.y-=r.speed;ctx.beginPath();ctx.arc(r.x,r.y,2.5,0,Math.PI*2);ctx.fillStyle='#fff5bd';ctx.fill();if(r.y<=r.target){burst(r.x,r.y,r.color);return false}return true});
 sparks=sparks.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.985;p.vy*=.985;p.life-=.012;if(p.life<=0)return false;ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowBlur=12;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;return true});
 requestAnimationFrame(draw)}
function celebrate(){for(let i=0;i<10;i++)setTimeout(()=>launch(innerWidth*(.1+Math.random()*.8)),i*160)}
function showWishes(){document.body.classList.add("show-wishes");const b=document.getElementById("wishButton");b.textContent="🎆 Enjoy the celebration!";b.disabled=true;b.style.opacity=".75";celebrate()}
setInterval(()=>launch(),700);draw();
</script>
</body>
</html>
